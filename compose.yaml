services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oneshop_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www:cached
    networks:
      - oneshop_network
    depends_on:
      - mysql


  nginx:
    image: nginx:alpine
    container_name: oneshop_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - oneshop_network
    depends_on:
      - app


  mysql:
    image: mysql:8.4
    container_name: oneshop_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: oneshop
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: oneshop
      MYSQL_PASSWORD: oneshop
    ports:
      - "3308:3306"
    volumes:
      - oneshop_mysql_data:/var/lib/mysql
    networks:
      - oneshop_network


networks:
  oneshop_network:
    driver: bridge


volumes:
  oneshop_mysql_data: