services:
  app:
    build:
      context: .
      dockerfile: docker/production/php/Dockerfile
    image: oneshop-app:production
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    volumes:
      - oneshop_storage:/var/www/storage
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    image: oneshop-app:production
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    volumes:
      - oneshop_storage:/var/www/storage
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: docker/production/nginx/Dockerfile
    image: oneshop-nginx:production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - oneshop_storage:/var/www/storage:ro
    networks:
      - backend
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    volumes:
      - oneshop_mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  backend:
    driver: bridge

volumes:
  oneshop_mysql_data:
  oneshop_storage:

